[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyattackmap"
version = "0.1.0"
description = "An Explainable Static Security Analysis and Data-Flow Visualization Library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PyAttackMap Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pyattackmap = "pyattackmap.cli:main"

[tool.setuptools]
packages = ["pyattackmap", "pyattackmap.dataflow", "pyattackmap.rules"]

[tool.setuptools.package-dir]
pyattackmap = "legacy_python"
"pyattackmap.dataflow" = "legacy_python/dataflow"
"pyattackmap.rules" = "legacy_python/rules"

[tool.pytest.ini_options]
testpaths = ["legacy_python/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
